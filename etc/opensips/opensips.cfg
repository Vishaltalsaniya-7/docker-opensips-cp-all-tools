####### Routing Logic ########

route {
    
    # Sanity checks
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    # Handle sequential requests
    if (has_totag()) {
        if (loose_route()) {
            # Handle NAT for in-dialog requests
            if (check_route_param("nat=yes")) {
                setbflag("NAT");
            }
            
            if (is_method("BYE")) {
                # Clean up RTPengine session
                rtpengine_delete();
                do_accounting("log","failed");
            }
    
            route(relay);
            exit;
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    t_relay();
                    exit;
                }
            }
            send_reply(404, "Not here");
            exit;
        }
    }

    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    t_check_trans();

    if (!is_method("REGISTER")) {
        if (is_myself($fd)) {
        } else {
            if (!is_myself($rd)) {
                send_reply(403, "Relay Forbidden");
                exit;
            }
        }
    }

    if (loose_route()) {
        xlog("L_ERR", "Attempt to route with preloaded Route's [$fu/$tu/$ru/$ci]");
        if (!is_method("ACK"))
            send_reply(403,"Preload Route denied");
        exit;
    }

    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    if (is_method("INVITE")) {
        do_accounting("log");
    }

    if (!is_myself($rd)) {
        append_hf("P-hint: outbound\r\n");
        route(relay);
        exit;
    }

    if (is_method("PUBLISH|SUBSCRIBE")) {
        send_reply(503, "Service Unavailable");
        exit;
    }

    if (is_method("REGISTER")) {
        route(handle_register);
        exit;
    }

    if ($rU==NULL) {
        send_reply(484, "Address Incomplete");
        exit;
    }

    if (is_method("INVITE")) {
        route(handle_invite);
        exit;
    }

    if (lookup("location")) {
        route(relay);
        exit;
    }

    send_reply(404, "User Not Found");
    exit;
}

route[handle_register] {
    xlog("L_INFO", "Received REGISTER from $fU@$fd (source: $si:$sp, contact: $ct)\n");
    
    if (!t_newtran()) {
        sl_reply_error();
        exit;
    }

    # Authentication
    if (!www_authorize("$fd", "subscriber")) {
        if ($au != NULL) {
            xlog("L_ERR", "Authentication failed for $au/$fU from $si\n");
        } else {
            xlog("L_DBG", "REGISTER received without credentials from $si\n");
        }
        www_challenge("$fd", "auth");
        exit;
    }

    force_rport();
    
    # NAT detection
    if (nat_uac_test(23)) {
        # if (nat_uac_test("diff-ip-src-via,private-contact") ) {
        xlog("L_INFO", "NAT detected for $fU from $si:$sp\n");
        setbflag("NAT");
        fix_nated_register();
    } else {
        xlog("L_INFO", "Fixing contact for Docker environment\n");
        fix_nated_register();
    }

    # Handle unregistration
    if (is_present_hf("Expires")) {
        if ($(hdr(Expires){s.int}) == 0) {
            xlog("L_INFO", "Unregistration for $tu\n");
            save("location");
            exit;
        }
    }
    # Save with replace flag (0x04 means replace all existing contacts)
    if (!save("location")) {
        xlog("L_ERR", "Failed to save registration for $tu\n");
        t_reply(500, "Server Internal Error");
        exit;
    }
 
    xlog("L_INFO", "Registration saved for $tu\n");
    xlog("L_INFO", "  Contact: $ct\n");
    xlog("L_INFO", "  Received from: $si:$sp\n");
    
    if (isbflagset("NAT")) {
        xlog("L_INFO", "NAT keepalives enabled for $tu\n");
    }
}
route[handle_invite] {
    xlog("L_INFO", "Processing INVITE from $fU to $rU (Via: $si:$sp, Contact: $ct)\n");
     if (nat_uac_test(23)) {
    # if (nat_uac_test("diff-ip-src-via,private-contact") ) {
        xlog("L_INFO", "Caller NAT detected for $fU from $si:$sp\n");
        setbflag("CALLER_NAT");
        force_rport();
        fix_nated_contact();
    }
    
    if (lookup("location")) {
        xlog("L_INFO", "Routing call from $fU to $rU at $ru\n");
        
        if (isbflagset("NAT")) {
            xlog("L_INFO", "Callee is behind NAT\n");
            setbflag("CALLEE_NAT");
        }
        
        if (isbflagset("CALLER_NAT") || isbflagset("CALLEE_NAT")) {
            add_rr_param(";nat=yes");
        }
        
        route(relay);
        exit;
    }
    
    xlog("L_INFO", "User $rU not found locally\n");
    do_accounting("log", "missed");
    send_reply(404, "User Not Found");
}

route[relay] {
    if (isbflagset("CALLER_NAT") || isbflagset("CALLEE_NAT")) {
        force_rport();
    }
    if (is_method("INVITE")) {
        xlog("L_INFO", "Processing INVITE for RTP relay\n");
        
        if (has_body("application/sdp")) {
            xlog("L_INFO", "INVITE has SDP body\n");
            
            $var(rtpengine_flags) = "";
         
            if (isbflagset("CALLER_NAT")) {
                $var(rtpengine_flags) = $var(rtpengine_flags) + " ICE=remove";
            }
            
            if (isbflagset("CALLEE_NAT")) {
                $var(rtpengine_flags) = $var(rtpengine_flags) + " replace-session-connection";
            }
            
            $var(rtpengine_flags) = "replace-origin replace-session-connection" + $var(rtpengine_flags);
            
            if (rtpengine_offer($var(rtpengine_flags))) {
                xlog("L_INFO", "RTPengine offer successful with flags: $var(rtpengine_flags)\n");
            }else {
                xlog("L_ERR", "RTPengine offer failed - code: $retcode\n");
            }
        }

        t_on_branch("per_branch_ops");
        t_on_reply("handle_nat");
        t_on_failure("missed_call");
    }

    if (is_method("BYE")) {
        rtpengine_delete();
    }
    
    if (!t_relay()) {
        send_reply(500,"Internal Error");
    }
}

branch_route[per_branch_ops] {
    xlog("L_INFO", "New branch to $ru\n");
    
    if (isbflagset("CALLEE_NAT")) {
        force_rport();
    }
}

onreply_route[handle_nat] {
    xlog("L_INFO", "Processing reply: $rs $rr from $si:$sp\n");

    if (is_method("INVITE") && t_check_status("200")) {
        xlog("L_INFO", "Processing 200 OK for INVITE\n");
        
        if (has_body("application/sdp")) {
            xlog("L_INFO", "200 OK has SDP body\n");
            
            $var(rtpengine_flags) = "replace-origin replace-session-connection";
            
            if (isbflagset("CALLER_NAT")) {
                $var(rtpengine_flags) = $var(rtpengine_flags) + " ICE=remove";
            }
            
            if (rtpengine_answer($var(rtpengine_flags))) {
                xlog("L_INFO", "RTPengine answer successful\n");
            } else {
                xlog("L_ERR", "RTPengine answer failed - code: $retcode\n");
            }
        }
    }
        # Fix NAT for replies
    if (isbflagset("CALLER_NAT") || isbflagset("CALLEE_NAT")) {
        fix_nated_contact();
    }
}

# Failure route
failure_route[missed_call] {
    if (t_was_cancelled()) {
        rtpengine_delete();
        exit;
    }
    
    # Handle busy/unavailable
    if (t_check_status("486|408|487")) {
        rtpengine_delete();
    }
}

